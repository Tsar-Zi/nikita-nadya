<!doctype html><html lang="ru"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;color:#49372c;font:18px/1.4 Georgia}label{display:block;margin:18px 0}input:not([type=radio]){box-sizing:border-box;width:100%;padding:12px;margin-top:8px;border:1px solid #b89c83;background:#faf5ef;font:15px Arial}fieldset{border:0;padding:0}fieldset label{margin:10px 0}button{padding:13px;border:0;background:#906e54;color:white;cursor:pointer}.guest-row{display:flex;gap:6px}.guest-row button{background:transparent;color:#49372c}.guest-hint,#form-status{font-size:14px}#additional-guests[hidden]{display:none}</style></head><body><form id="preview-form"><label>Ваше имя и фамилия<input name="name" autocomplete="name" placeholder="Например, Иван Иванов" maxlength="150" required></label><fieldset><legend>Вы сможете присутствовать на торжестве?</legend><label class="radio"><input type="radio" name="attend" value="Да, с радостью" required> Да, с радостью</label><label class="radio"><input type="radio" name="attend" value="К сожалению, не смогу"> К сожалению, не смогу</label></fieldset><div id="additional-guests" hidden><p>Дополнительные гости</p><p class="guest-hint">Если придёте не один, впишите каждого по имени и фамилии</p><div id="guest-list"></div><button type="button" id="add-guest" class="button outline">Добавить гостя</button></div><button class="button" type="submit">Отправить</button><p id="form-status" role="status" class="form-note">Приём ответов ещё не подключён.</p></form><script>const preview=document.querySelector('#preview-form');
if(preview){
 const group=preview.querySelector('#additional-guests'),list=preview.querySelector('#guest-list'),add=preview.querySelector('#add-guest');
 preview.addEventListener('change',()=>{group.hidden=preview.elements.attend.value!=='Да, с радостью';list.querySelectorAll('input').forEach(i=>i.disabled=group.hidden)});
 add.addEventListener('click',()=>{if(list.children.length>=12)return;const row=document.createElement('label');row.className='guest-row';const input=document.createElement('input');input.name='guests';input.placeholder='Имя и фамилия';input.maxLength=150;input.required=true;input.setAttribute('aria-label','Имя и фамилия дополнительного гостя');const remove=document.createElement('button');remove.type='button';remove.textContent='Удалить';remove.addEventListener('click',()=>{row.remove();add.disabled=false});row.append(input,remove);list.append(row);add.disabled=list.children.length>=12;input.focus()});
}

preview.addEventListener('submit',e=>{e.preventDefault();const button=preview.querySelector('button[type=submit]'),status=document.querySelector('#form-status');button.disabled=true;status.textContent='Сохраняем ответ…';const fd=new FormData(preview);google.script.run.withSuccessHandler(()=>{status.textContent='Спасибо! Ваш ответ получен.';button.disabled=false;window.top.postMessage({type:'wedding-rsvp-saved'},'https://tsar-zi.github.io')}).withFailureHandler(()=>{status.textContent='Не удалось подтвердить сохранение. Попробуйте ещё раз или свяжитесь с молодожёнами.';button.disabled=false}).submitRsvp({name:fd.get('name'),attend:fd.get('attend'),guests:fd.getAll('guests')})});</script></body></html>
