<!doctype html><html lang="ru"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;color:#49372c;font:18px/1.4 Georgia,serif}label{display:block;margin:18px 0}input:not([type=radio]),textarea{box-sizing:border-box;width:100%;display:block;margin-top:8px;border:1px solid #b89c83;background:#faf5ef;padding:12px;font:15px/1.5 Arial}fieldset{border:0;padding:0;margin:24px 0}fieldset label{margin:10px 0}input[type=radio]{accent-color:#906e54}button{width:100%;border:0;background:#906e54;color:#fff9f2;padding:17px;font:13px Arial;cursor:pointer}button:disabled{opacity:.6}#status{font-size:16px}textarea{resize:vertical}.trap{position:absolute;left:-9999px}</style></head><body><form id="form"><label>Ваше имя и фамилия<input name="name" autocomplete="name" maxlength="150" required placeholder="Как вас зовут"></label><fieldset><legend>Сможете присутствовать?</legend><label><input type="radio" name="attendance" value="Да" required> Да, с удовольствием!</label><label><input type="radio" name="attendance" value="Нет"> К сожалению, не смогу</label></fieldset><label>Имя и фамилия спутника<input name="companion" maxlength="150" placeholder="Если придёте вдвоём"></label><label>Комментарий<textarea name="comment" rows="3" maxlength="1000"></textarea></label><label class="trap" aria-hidden="true">Сайт<input name="website" tabindex="-1" autocomplete="off"></label><button>Отправить ответ</button><p id="status" role="status"></p></form><script>const form=document.querySelector('#form'),button=form.querySelector('button'),status=document.querySelector('#status');form.addEventListener('submit',e=>{e.preventDefault();button.disabled=true;status.textContent='Сохраняем ответ…';google.script.run.withSuccessHandler(()=>{status.textContent='Спасибо! Ваш ответ сохранён.';form.reset();button.disabled=false}).withFailureHandler(()=>{status.textContent='Не удалось подтвердить сохранение. Попробуйте ещё раз или напишите Никите и Надежде.';button.disabled=false}).submitRsvp(Object.fromEntries(new FormData(form)))});</script></body></html>
